<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px "Roboto", Arial, sans-serif; width: 340px; margin: 0; padding: 14px; color: #0f0f0f; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 15px; margin: 0; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-weight: 500; }
  .track { width: 38px; height: 22px; border-radius: 11px; background: #bbb; position: relative; transition: background .15s; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on .track { background: #1a73e8; }
  .switch.on .track::after { left: 19px; }
  .off-note { background: #fef7e0; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; color: #5f4b00; display: none; }
  body.off .off-note { display: block; }
  body.off .data { opacity: .45; }
  .opts { display: flex; gap: 16px; margin: -2px 0 8px; }
  .opt { min-width: 140px; }
  .opt { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .hint { display: none; margin: 0 0 10px; font-size: 12px; color: #606060; }
  body.logonly .hint { display: block; }
  body.off .opts { opacity: .45; pointer-events: none; }
  .tiles { display: flex; gap: 8px; margin-bottom: 12px; }
  .tile { flex: 1; background: #f2f2f2; border-radius: 8px; padding: 8px; }
  .tile b { display: block; font-size: 18px; }
  .tile span { color: #606060; font-size: 11px; }
  h2 { font-size: 12px; color: #606060; font-weight: 500; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 0; border-bottom: 1px solid #eee; vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
  .vt { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #e8f0fe; color: #1a56c4; margin-left: 4px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  button { flex: 1; padding: 7px; border-radius: 16px; border: 1px solid #ccc; background: #fff; cursor: pointer; font: 500 12px Roboto, Arial, sans-serif; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  .muted { color: #606060; }
</style>
</head>
<body>
  <div class="top">
    <h1>Lomb Input</h1>
    <div class="switch on" id="power" role="switch" aria-checked="true" tabindex="0">
      <span id="powerLabel">On</span><span class="track"></span>
    </div>
  </div>
  <div class="opts">
    <label class="opt"><input type="checkbox" id="optOverlay"> Subtitle overlay</label>
    <label class="opt"><input type="checkbox" id="optSidebar"> Sidebar</label>
  </div>
  <div class="opts">
    <label class="opt"><input type="checkbox" id="optSecond"> English subtitles</label>
    <label class="opt"><input type="checkbox" id="optHover"> Hover dictionary</label>
  </div>
  <p class="hint" id="logOnlyHint">Logging only: Lomb shows nothing on YouTube and leaves its captions alone, but still records what you watch.</p>
  <div class="off-note">Paused: no subtitles overlay and nothing is logged until you switch it back on.</div>
  <div class="data">
    <div class="tiles">
      <div class="tile"><b id="min">0</b><span>minutes today</span></div>
      <div class="tile"><b id="lines">0</b><span>lines today</span></div>
      <div class="tile"><b id="vids">0</b><span>videos today</span></div>
    </div>
    <h2>Today by language</h2>
    <table id="langs"></table>
    <h2>Last 7 days</h2>
    <table id="days"></table>
    <h2>Recent videos</h2>
    <table id="recent"></table>
    <div class="btns">
      <button class="primary" id="export">Export JSONL</button>
      <button id="clear">Clear viewings</button>
    </div>
    <p class="muted" id="note"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
